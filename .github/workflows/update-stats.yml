name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */12 * * *'   # هر ۱۲ ساعت یه‌بار خودکار اجرا میشه
  workflow_dispatch:          # امکان اجرای دستی از تب Actions
  push:
    branches: [main]
    paths:
      - 'scripts/generate_stats.py'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stats SVGs (مستقیم از API خود گیت‌هاب، بدون سرویس واسطه)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: update github stats svgs [skip ci]"
          git push
